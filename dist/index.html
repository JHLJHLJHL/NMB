<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#081b2b" />
  <title>멀미마요 — 포항·울릉 뱃길 예보</title>
  <meta name="description" content="포항과 울릉도를 오가는 여객선 항로의 시간대별 파고, 풍속, 풍향과 멀미 위험을 지도에서 확인하세요." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      color-scheme: light;
      --ink: #0a2235;
      --muted: #617384;
      --line: rgba(9, 35, 53, .12);
      --surface: rgba(255, 255, 255, .94);
      --accent: #0b8f80;
      --navy: #081b2b;
      --safe: #0a9b83;
      --level-2: #71ad45;
      --watch: #e2a934;
      --rough: #e57838;
      --danger: #d84949;
      font-family: "Noto Sans KR", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; }
    body { color: var(--ink); background: #c9e0e5; }
    button, a { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #70d8ce; outline-offset: 2px; }

    .app {
      --map-toolbar-top: calc(max(14px, env(safe-area-inset-top)) + 123px);
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 620px;
      overflow: hidden;
      isolation: isolate;
      background: #bad8de;
    }

    #map { position: absolute; inset: 0; z-index: 0; }
    .leaflet-control-attribution { font-size: 9px; opacity: .65; }
    .leaflet-control-zoom { display: none; }

    .map-wash {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(4, 23, 38, .26) 0%, transparent 18%),
        linear-gradient(0deg, rgba(4, 23, 38, .18) 0%, transparent 33%);
    }

    .topbar {
      position: absolute;
      z-index: 500;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .brand,
    .forecast-strip,
    .view-controls,
    .weather-tools,
    .legend,
    .layer-switch,
    .summary-card { pointer-events: auto; }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px 8px 9px;
      border: 1px solid rgba(255,255,255,.54);
      border-radius: 16px;
      color: #fff;
      background: rgba(7, 28, 43, .86);
      box-shadow: 0 10px 28px rgba(4, 21, 35, .16);
      backdrop-filter: blur(18px);
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 31px;
      height: 31px;
      border-radius: 11px;
      background: #f0c95f;
      color: #092236;
    }

    .brand strong { display: block; font-size: 15px; line-height: 1; letter-spacing: -.03em; }
    .brand span { display: block; margin-top: 4px; font-size: 9px; font-weight: 600; opacity: .68; }

    .top-actions { display: flex; gap: 7px; }
    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 14px;
      color: #fff;
      background: rgba(7, 28, 43, .86);
      box-shadow: 0 10px 28px rgba(4, 21, 35, .16);
      backdrop-filter: blur(18px);
      cursor: pointer;
      text-decoration: none;
    }
    .icon-button::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: max-content;
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 9px;
      color: #fff;
      background: rgba(7,28,43,.92);
      box-shadow: 0 8px 22px rgba(4,21,35,.2);
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-3px);
      transition: opacity .16s ease, transform .16s ease;
    }
    .icon-button:focus-visible::after { opacity: 1; transform: translateY(0); }
    @media (hover: hover) {
      .icon-button:hover::after { opacity: 1; transform: translateY(0); }
    }

    .forecast-strip {
      position: absolute;
      z-index: 500;
      top: calc(max(14px, env(safe-area-inset-top)) + 55px);
      left: 14px;
      right: 14px;
      display: grid;
      grid-template-columns: repeat(6, minmax(74px, 1fr));
      gap: 4px;
      padding: 5px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 18px;
      background: rgba(255,255,255,.88);
      box-shadow: 0 12px 36px rgba(7, 35, 49, .15);
      backdrop-filter: blur(18px);
      scrollbar-width: none;
    }
    .forecast-strip::-webkit-scrollbar { display: none; }

    .day-button {
      min-width: 74px;
      padding: 7px 5px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      cursor: pointer;
      text-align: center;
    }
    .day-button[aria-selected="true"] { color: #fff; background: var(--navy); }
    .day-button strong { display: block; font-size: 12px; line-height: 1.2; }
    .day-button span { display: block; margin-top: 3px; font: 600 10px/1.2 "DM Sans", sans-serif; opacity: .65; }

    .map-toolbar {
      position: absolute;
      z-index: 500;
      top: var(--map-toolbar-top);
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
    }
    .view-controls { display: flex; gap: 6px; }
    .weather-tools { display: grid; justify-items: end; gap: 8px; }

    .layer-switch {
      display: grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 16px;
      background: rgba(255,255,255,.91);
      box-shadow: 0 10px 28px rgba(7, 35, 49, .13);
      backdrop-filter: blur(16px);
    }
    .layer-switch button {
      width: 48px;
      height: 36px;
      padding: 0 4px;
      border: 0;
      border-radius: 11px;
      color: #627586;
      background: transparent;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
    }
    .layer-switch button[aria-pressed="true"] { color: #fff; background: var(--navy); }

    .legend {
      width: 54px;
      padding: 10px 8px;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 16px;
      background: rgba(255,255,255,.91);
      box-shadow: 0 10px 26px rgba(7,35,49,.13);
      backdrop-filter: blur(16px);
    }
    .legend-title { margin-bottom: 7px; font-size: 9px; font-weight: 800; letter-spacing: -.02em; text-align: center; }
    .legend-scale { display: grid; grid-template-columns: 10px 1fr; gap: 6px; height: 106px; }
    .legend-gradient {
      border-radius: 99px;
      background: linear-gradient(180deg, var(--danger) 0%, var(--rough) 25%, var(--watch) 52%, var(--level-2) 75%, var(--safe) 100%);
    }
    .legend-values { display: flex; flex-direction: column; justify-content: space-between; color: #516675; font: 700 8px/1 "DM Sans", sans-serif; }
    .legend-unit { margin-top: 7px; color: #748895; font: 700 8px/1 "DM Sans", sans-serif; text-align: center; }

    .map-tool-button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 14px;
      color: #fff;
      background: rgba(7,28,43,.88);
      box-shadow: 0 10px 28px rgba(7,35,49,.18);
      cursor: pointer;
      backdrop-filter: blur(16px);
    }
    .map-tool-button svg { width: 18px; height: 18px; stroke-width: 2.4; }
    .map-tool-button:hover:not(:disabled) { background: rgba(255,255,255,.12); }
    .map-tool-button:disabled { cursor: not-allowed; opacity: .62; }

    .summary-card {
      position: absolute;
      z-index: 500;
      left: 5px;
      width: 380px;
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 15px;
      border: 1px solid rgba(255,255,255,.74);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 22px 52px rgba(5, 29, 45, .2);
      backdrop-filter: blur(22px);
    }

    .summary-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .eyebrow-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .eyebrow { margin: 0; color: var(--accent); font-size: 9px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .summary-advisory { padding: 3px 6px; border-radius: 999px; color: #fff; background: var(--danger); font-size: 8px; font-weight: 800; letter-spacing: 0; }
    .route-title { margin: 0; font-size: 17px; line-height: 1.25; letter-spacing: -.04em; }
    .vessel { margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 600; }

    .risk-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 6px 8px;
      border-radius: 12px;
      color: #fff;
      background: var(--safe);
      font-size: 10px;
      font-weight: 800;
    }

    .trip-line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      margin-top: 13px;
    }
    .trip-stop { min-width: 65px; }
    .trip-stop:last-child { text-align: right; }
    .trip-stop strong, .arrival-time { display: block; font: 700 16px/1 "DM Sans", sans-serif; letter-spacing: -.04em; }
    .trip-stop span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; font-weight: 700; }
    .time-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 8px; font-weight: 800; }
    .time-input { width: 108px; height: 30px; padding: 0 5px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #edf4f4; font: 700 14px/1 "DM Sans", sans-serif; }
    .trip-track { position: relative; height: 1px; background: #b5cbd0; }
    .trip-track::before, .trip-track::after {
      content: "";
      position: absolute;
      top: -3px;
      width: 7px;
      height: 7px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .trip-track::before { left: 0; }
    .trip-track::after { right: 0; }
    .trip-track svg { position: absolute; top: -9px; left: calc(50% - 9px); width: 18px; height: 18px; padding: 3px; border-radius: 50%; background: #fff; color: var(--navy); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 13px;
    }
    .metric { padding: 9px 10px; border-radius: 14px; background: #edf4f4; }
    .metric span { display: block; color: #6a7c89; font-size: 8px; font-weight: 800; }
    .metric strong { display: block; margin-top: 3px; font: 700 13px/1.2 "DM Sans", sans-serif; }

    .summary-actions { display: flex; align-items: center; gap: 7px; margin-top: 11px; }
    .link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      text-decoration: none;
      font-size: 9px;
      font-weight: 800;
    }
    .link-button.primary { color: #fff; border-color: var(--navy); background: var(--navy); }
    .notice { margin: 9px 0 0; color: #71828e; font-size: 8px; line-height: 1.45; }

    .route-marker { background: none; border: 0; }
    .marker-shell { position: relative; width: 36px; height: 44px; }
    .marker-face {
      position: absolute;
      top: 1px;
      left: 1px;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 3px solid #fff;
      border-radius: 50% 50% 50% 9px;
      color: #fff;
      background: var(--marker-color);
      box-shadow: 0 5px 14px rgba(2,22,34,.24);
      transform: rotate(-45deg);
    }
    .marker-face svg { width: 19px; height: 19px; stroke-width: 2.2; transform: rotate(45deg); }
    .marker-label {
      position: absolute;
      left: 41px;
      top: -5px;
      width: max-content;
      padding: 6px 8px;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 10px;
      color: #fff;
      background: rgba(7,28,43,.89);
      box-shadow: 0 6px 16px rgba(4,25,39,.16);
      backdrop-filter: blur(12px);
      font-size: 9px;
      line-height: 1.35;
      font-weight: 700;
    }
    .marker-label strong { font: 700 11px/1.2 "DM Sans", sans-serif; }
    .wind-value { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .wind-arrow {
      display: inline-grid;
      place-items: center;
      width: 13px;
      height: 13px;
      color: currentColor;
      transform: rotate(var(--wind-rotation));
      transform-origin: center;
    }
    .wind-arrow svg { width: 13px; height: 13px; stroke-width: 2.4; }
    .route-marker.label-left .marker-label { left: auto; right: 41px; text-align: right; }
    .route-marker.compact .marker-label { display: none; }
    .route-marker.compact .marker-shell { width: 30px; height: 36px; }
    .route-marker.compact .marker-face {
      width: 28px;
      height: 28px;
      border-width: 2px;
      border-radius: 50% 50% 50% 7px;
    }
    .route-marker.compact .marker-face svg { width: 15px; height: 15px; }

    .flow-particle-icon { background: transparent; border: 0; pointer-events: none !important; }
    .flow-particle {
      display: block;
      width: 11px;
      height: 11px;
      border: 2px solid rgba(255,255,255,.98);
      border-radius: 50%;
      background: #0b8f80;
      box-shadow: 0 0 0 3px rgba(255,255,255,.24), 0 3px 10px rgba(3,31,42,.34);
      animation: flow-pulse 1.15s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes flow-pulse {
      0%, 100% { opacity: .76; transform: scale(.82); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow-particle { animation: none; opacity: .78; }
    }

    .leaflet-popup-content-wrapper {
      border-radius: 17px;
      box-shadow: 0 16px 36px rgba(4,25,39,.2);
    }
    .leaflet-popup-content { width: 174px !important; margin: 13px 14px; }
    .popup-time { font: 700 16px/1 "DM Sans", sans-serif; }
    .popup-place { margin-top: 4px; color: #647785; font-size: 10px; font-weight: 700; }
    .popup-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 10px; }
    .popup-grid div { padding: 7px; border-radius: 9px; background: #edf4f4; }
    .popup-grid span { display: block; color: #71828d; font-size: 8px; }
    .popup-grid strong { display: block; margin-top: 2px; font: 700 11px/1.2 "DM Sans", sans-serif; }
    .popup-grid .wind-value { display: inline-flex; }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      z-index: 899;
      background: rgba(3, 17, 27, .42);
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
    }
    .sheet {
      position: absolute;
      z-index: 900;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: min(78svh, 650px);
      padding: 11px 16px max(18px, env(safe-area-inset-bottom));
      overflow-y: auto;
      border-radius: 28px 28px 0 0;
      background: #f7faf9;
      box-shadow: 0 -20px 60px rgba(3,17,27,.24);
      visibility: hidden;
      transform: translateY(102%);
      transition: transform .28s cubic-bezier(.22,.75,.25,1), visibility 0s linear .28s;
    }
    .sheet.open { visibility: visible; transform: translateY(0); transition-delay: 0s; }
    .sheet.open + .sheet-backdrop { opacity: 1; pointer-events: auto; }
    .sheet-handle { width: 38px; height: 4px; margin: 0 auto 15px; border-radius: 99px; background: #c1ced1; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; }
    .sheet-header h2 { margin: 0; font-size: 20px; letter-spacing: -.04em; }
    .sheet-close { display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 12px; background: #e8f0f0; cursor: pointer; }
    .route-list { display: grid; gap: 8px; margin-top: 15px; }
    .route-option {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }
    .route-option.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .route-option strong { display: block; font-size: 13px; }
    .route-option span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; font-weight: 600; }
    .route-option time { align-self: center; color: var(--ink); font: 700 12px/1 "DM Sans", sans-serif; }

    .expanded .forecast-strip,
    .expanded .summary-card { opacity: 0; pointer-events: none; transform: translateY(8px); }
    .forecast-strip, .summary-card { transition: opacity .2s ease, transform .2s ease; }

    @media (min-width: 760px) {
      .app { --map-toolbar-top: 137px; }
      .topbar, .forecast-strip { left: 24px; right: 24px; }
      .forecast-strip { right: auto; width: 660px; }
      .map-toolbar { left: 24px; right: 24px; }
      .summary-card { left: 24px; bottom: 24px; }
      .sheet { left: 50%; right: auto; width: 500px; transform: translate(-50%, 102%); }
      .sheet.open { transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div id="map" aria-label="포항과 울릉 사이 여객선 항로 예보 지도"></div>
    <div class="map-wash" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="waves"></i></div>
        <div><strong>멀미마요</strong><span>뱃길 예보 · DEMO</span></div>
      </div>
    </header>

    <section class="forecast-strip" id="forecastStrip" aria-label="6일 예보"></section>

    <div class="map-toolbar">
      <div class="view-controls" role="group" aria-label="지도 보기 조절">
        <button class="map-tool-button" id="zoomInButton" type="button" aria-label="지도 확대" disabled><i data-lucide="plus"></i></button>
        <button class="map-tool-button" id="zoomOutButton" type="button" aria-label="지도 축소" disabled><i data-lucide="minus"></i></button>
        <button class="map-tool-button" id="expandButton" type="button" aria-label="지도 크게"><i data-lucide="maximize-2"></i></button>
      </div>
      <div class="weather-tools">
        <aside class="layer-switch" aria-label="지도 표시 정보">
          <button type="button" data-layer="wave" aria-pressed="true">파고</button>
          <button type="button" data-layer="wind" aria-pressed="false">풍속</button>
        </aside>
        <aside class="legend" aria-label="지도 범례">
          <div class="legend-title" id="legendTitle">파고</div>
          <div class="legend-scale">
            <div class="legend-gradient"></div>
            <div class="legend-values" id="legendValues"></div>
          </div>
          <div class="legend-unit" id="legendUnit">m</div>
        </aside>
      </div>
    </div>

    <section class="summary-card" aria-live="polite">
      <div class="summary-head">
        <div>
          <div class="eyebrow-row"><p class="eyebrow" id="routeEyebrow">오늘 · 상세 예보</p><span class="summary-advisory" id="summaryAdvisory" hidden>풍랑특보 · 예시</span></div>
          <h1 class="route-title" id="routeTitle"></h1>
          <div class="vessel" id="vessel"></div>
        </div>
        <div class="risk-pill" id="riskPill"></div>
      </div>
      <div class="trip-line">
        <div class="trip-stop"><label class="time-label" for="departureTimeInput">출발 시간</label><input class="time-input" id="departureTimeInput" type="time" step="300" /><span id="departurePort"></span></div>
        <div class="trip-track"><i data-lucide="ship"></i></div>
        <div class="trip-stop"><span class="time-label">도착 시간</span><output class="arrival-time" id="arrivalTime"></output><span id="arrivalPort"></span></div>
      </div>
      <div class="metrics">
        <div class="metric"><span>최고 파고</span><strong id="maxWave"></strong></div>
        <div class="metric"><span>최고 풍속</span><strong id="maxWind"></strong></div>
        <div class="metric"><span>예보 지점</span><strong id="pointCount"></strong></div>
      </div>
      <div class="summary-actions">
        <button class="link-button" id="routeButton" type="button"><i data-lucide="route"></i><span>경로 설정</span></button>
        <a class="link-button" id="operatorLink" href="#" target="_blank" rel="noopener noreferrer"><i data-lucide="ship-wheel"></i><span>운항사</span></a>
        <a class="link-button primary" href="https://island.theksa.co.kr/page/main" target="_blank" rel="noopener noreferrer"><i data-lucide="ticket-check"></i><span>가보고싶은섬 예매</span></a>
      </div>
      <p class="notice">현재 수치는 화면 검증용 예시입니다. 실제 출항 전에는 선사 운항 공지와 기상청 특보를 반드시 확인하세요.</p>
    </section>

    <section class="sheet" id="routeSheet" role="dialog" aria-modal="true" aria-labelledby="routeSheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div><p class="eyebrow">ROUTE</p><h2 id="routeSheetTitle">어느 배를 타세요?</h2></div>
        <button class="sheet-close" id="sheetClose" type="button" aria-label="닫기"><i data-lucide="x"></i></button>
      </div>
      <div class="route-list" id="routeList"></div>
    </section>
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script type="module">
    import { buildFlowParticles, buildForecastDays, buildRoutePoints, getMotionSicknessLevel, getRouteCatalog, getRouteMarkerLayout, getRouteSchedule, getWindDirectionRotation, getZoomControlState } from './app-data.mjs';

    const routes = getRouteCatalog();
    const days = buildForecastDays();
    const app = document.querySelector('#app');
    const routeSheet = document.querySelector('#routeSheet');
    const state = {
      routeIndex: 1,
      dayIndex: 0,
      layer: 'wave',
      expanded: false,
      departureTimes: Object.fromEntries(routes.map((route) => [route.id, route.departure])),
    };
    let routeLayer;
    let flowLayer;
    let flowMarkers = [];
    let flowAnimationFrame;
    let flowAnimationStartedAt;
    let markerLayer;
    let fittedMinZoom;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const map = L.map('map', {
      zoomControl: false,
      attributionControl: true,
      minZoom: 6,
      maxZoom: 12,
      zoomSnap: .25,
      preferCanvas: true,
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;',
      })[character]);
    }

    function iconSVG(name, size = 20) {
      const icons = {
        'face-grinning': '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
        'face-slightly-smiling': '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/>',
        'face-neutral': '<circle cx="12" cy="12" r="9"/><path d="M9 15h6"/><path d="M9 9h.01M15 9h.01"/>',
        'face-slightly-frowning': '<circle cx="12" cy="12" r="9"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/><path d="M9 9h.01M15 9h.01"/>',
        'face-angry': '<circle cx="12" cy="12" r="9"/><path d="m8 9 2 1M16 9l-2 1"/><path d="M8 16s1.5-2 4-2 4 2 4 2"/>',
        'arrow-up': '<path d="m18 15-6-6-6 6"/><path d="M12 9v12"/>',
      };
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name] || icons['face-neutral']}</svg>`;
    }

    function windDirectionHTML(direction, { showLabel = false } = {}) {
      const rotation = getWindDirectionRotation(direction);
      return `<span class="wind-value"><span class="wind-arrow" style="--wind-rotation:${rotation}deg">${iconSVG('arrow-up', 13)}</span>${showLabel ? escapeHTML(direction) : ''}</span>`;
    }

    function colorFor(value, type) {
      const stops = type === 'wave'
        ? [[.8, '#0a9b83'], [1.6, '#71ad45'], [2.4, '#e2a934'], [3.2, '#e57838'], [Infinity, '#d84949']]
        : [[5, '#0a9b83'], [8, '#71ad45'], [11, '#e2a934'], [14, '#e57838'], [Infinity, '#d84949']];
      return stops.find(([max]) => value <= max)[1];
    }

    function renderDays() {
      document.querySelector('#forecastStrip').innerHTML = days.map((day) => `
        <button class="day-button" type="button" data-day="${day.index}" aria-selected="${day.index === state.dayIndex}">
          <strong>${escapeHTML(day.label)}</strong>
          <span>${escapeHTML(day.date)}</span>
        </button>
      `).join('');
    }

    function renderRouteOptions() {
      document.querySelector('#routeList').innerHTML = routes.map((route, index) => `
        <button class="route-option ${index === state.routeIndex ? 'selected' : ''}" type="button" data-route="${index}">
          <span>
            <strong>${escapeHTML(route.from)} → ${escapeHTML(route.to)}</strong>
            <span>${escapeHTML(route.vessel)} · ${escapeHTML(route.operator)}</span>
          </span>
          <time>${escapeHTML(getRouteSchedule(route, state.departureTimes[route.id]).departure)} — ${escapeHTML(getRouteSchedule(route, state.departureTimes[route.id]).arrival.replace('다음날 ', '+1 '))}</time>
        </button>
      `).join('');
    }

    function markerIcon(point, index, total) {
      const risk = getMotionSicknessLevel(point.waveHeight);
      const compact = state.expanded && !point.isEndpoint;
      const { iconSize, iconAnchor } = getRouteMarkerLayout(compact);
      const labelLeft = point.position[1] > 130.25;
      const displayTime = point.time.replace('다음날 ', '+1 ');
      const label = `<div class="marker-label"><strong>${escapeHTML(displayTime)}</strong><br>${point.waveHeight.toFixed(1)}m · ${windDirectionHTML(point.windDirection)}${point.windSpeed.toFixed(1)}m/s</div>`;
      const html = `
        <div class="marker-shell">
          <div class="marker-face" style="--marker-color:${risk.color}">${iconSVG(risk.icon, 19)}</div>
          ${compact ? '' : label}
        </div>`;
      return L.divIcon({
        className: `route-marker ${compact ? 'compact' : ''} ${labelLeft ? 'label-left' : ''}`,
        html,
        iconSize,
        iconAnchor,
      });
    }

    function mappedRouteSegments(route, forecastPoints) {
      const path = route.path;
      const cumulative = [0];
      path.slice(1).forEach((position, index) => {
        cumulative.push(cumulative.at(-1) + map.distance(path[index], position));
      });
      const totalDistance = cumulative.at(-1) || 1;
      return path.slice(0, -1).map((position, index) => {
        const progress = (cumulative[index] + cumulative[index + 1]) / 2 / totalDistance;
        const weather = forecastPoints.reduce((nearest, point) => (
          Math.abs(point.progress - progress) < Math.abs(nearest.progress - progress) ? point : nearest
        ));
        return { position, nextPosition: path[index + 1], weather };
      });
    }

    function markerPopup(point) {
      const risk = getMotionSicknessLevel(point.waveHeight);
      return `
        <div class="popup-time">${escapeHTML(point.time)}</div>
        <div class="popup-place">${escapeHTML(point.label)} · 멀미 ${risk.level}단계</div>
        <div class="popup-grid">
          <div><span>파고</span><strong>${point.waveHeight.toFixed(1)} m</strong></div>
          <div><span>풍속</span><strong>${point.windSpeed.toFixed(1)} m/s</strong></div>
          <div><span>풍향</span><strong>${windDirectionHTML(point.windDirection, { showLabel: true })}</strong></div>
          <div><span>체감</span><strong style="color:${risk.color}">${escapeHTML(risk.label)}</strong></div>
        </div>`;
    }

    function startRouteFlow(route) {
      if (flowAnimationFrame) cancelAnimationFrame(flowAnimationFrame);
      flowMarkers = [];
      flowAnimationStartedAt = performance.now();
      const particleIcon = L.divIcon({
        className: 'flow-particle-icon',
        html: '<span class="flow-particle"></span>',
        iconSize: [11, 11],
        iconAnchor: [5.5, 5.5],
      });

      const draw = (timestamp) => {
        const phase = reduceMotion ? 0.06 : ((timestamp - flowAnimationStartedAt) % 4200) / 4200;
        const particles = buildFlowParticles(route, { phase });
        if (!flowMarkers.length) {
          flowMarkers = particles.map(({ position }) => L.marker(position, {
            icon: particleIcon,
            interactive: false,
            keyboard: false,
            zIndexOffset: -80,
          }).addTo(flowLayer));
        } else {
          particles.forEach(({ position }, index) => flowMarkers[index].setLatLng(position));
        }
        if (!reduceMotion) flowAnimationFrame = requestAnimationFrame(draw);
      };

      flowAnimationFrame = requestAnimationFrame(draw);
    }

    function renderLegend() {
      const wave = state.layer === 'wave';
      document.querySelector('#legendTitle').textContent = wave ? '파고' : '풍속';
      document.querySelector('#legendUnit').textContent = wave ? 'm' : 'm/s';
      document.querySelector('#legendValues').innerHTML = (wave ? ['3.2+', '2.4', '1.6', '0.8', '0'] : ['14+', '11', '8', '5', '0'])
        .map((value) => `<span>${value}</span>`).join('');
    }

    function renderSummary(points) {
      const route = routes[state.routeIndex];
      const day = days[state.dayIndex];
      const maxWave = Math.max(...points.map(({ waveHeight }) => waveHeight));
      const maxWind = Math.max(...points.map(({ windSpeed }) => windSpeed));
      const risk = getMotionSicknessLevel(maxWave);
      document.querySelector('#routeEyebrow').textContent = `${day.label} · ${day.precision} 예보`;
      const summaryAdvisory = document.querySelector('#summaryAdvisory');
      summaryAdvisory.hidden = day.state !== '위험';
      document.querySelector('#routeTitle').textContent = `${route.from} → ${route.to}`;
      document.querySelector('#vessel').textContent = `${route.vesselType} · ${route.vessel}`;
      document.querySelector('#departureTimeInput').value = state.departureTimes[route.id];
      document.querySelector('#departurePort').textContent = route.from;
      document.querySelector('#arrivalTime').textContent = points.at(-1).time.replace('다음날 ', '+1 ');
      document.querySelector('#arrivalPort').textContent = route.to;
      document.querySelector('#maxWave').textContent = `${maxWave.toFixed(1)} m`;
      document.querySelector('#maxWind').textContent = `${maxWind.toFixed(1)} m/s`;
      document.querySelector('#pointCount').textContent = `${points.length}곳`;
      const riskPill = document.querySelector('#riskPill');
      riskPill.style.background = risk.color;
      riskPill.innerHTML = `${iconSVG(risk.icon, 17)}<span>${risk.level}단계 · ${risk.label}</span>`;
      const operatorLink = document.querySelector('#operatorLink');
      operatorLink.href = route.operatorUrl;
      operatorLink.querySelector('span').textContent = route.operator;
    }

    function renderMap({ fit = false } = {}) {
      const route = routes[state.routeIndex];
      const points = buildRoutePoints(route, {
        expanded: state.expanded,
        dayIndex: state.dayIndex,
        departureTime: state.departureTimes[route.id],
      });
      if (routeLayer) routeLayer.remove();
      if (flowLayer) flowLayer.remove();
      if (markerLayer) markerLayer.remove();
      routeLayer = L.layerGroup().addTo(map);
      flowLayer = L.layerGroup().addTo(map);
      markerLayer = L.layerGroup().addTo(map);

      mappedRouteSegments(route, points).forEach(({ position, nextPosition, weather }) => {
        const value = state.layer === 'wave'
          ? weather.waveHeight
          : weather.windSpeed;
        L.polyline([position, nextPosition], {
          color: colorFor(value, state.layer),
          weight: state.expanded ? 5 : 6,
          opacity: .93,
          lineCap: 'round',
        }).addTo(routeLayer);
      });

      points.forEach((point, index) => {
        L.marker(point.position, { icon: markerIcon(point, index, points.length), zIndexOffset: point.isEndpoint ? 150 : 0 })
          .bindPopup(markerPopup(point), { closeButton: false, offset: [0, -10] })
          .addTo(markerLayer);
      });
      startRouteFlow(route);

      if (fit) {
        map.setMinZoom(6);
        map.fitBounds(L.latLngBounds(route.path), {
          paddingTopLeft: [46, 190],
          paddingBottomRight: [46, 255],
          animate: false,
        });
        fittedMinZoom = map.getZoom();
        map.options.minZoom = fittedMinZoom;
      }
      updateZoomControls();
      renderSummary(points);
      renderLegend();
      if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 2 } });
    }

    function setExpanded(expanded, fromZoom = false) {
      if (state.expanded === expanded) return;
      state.expanded = expanded;
      app.classList.toggle('expanded', expanded);
      const button = document.querySelector('#expandButton');
      const label = expanded ? '요약 보기' : '지도 크게';
      button.innerHTML = `<i data-lucide="${expanded ? 'minimize-2' : 'maximize-2'}"></i>`;
      button.setAttribute('aria-label', label);
      button.title = label;
      renderMap();
      if (!fromZoom && expanded) map.setZoom(Math.min(map.getZoom() + 1, map.getMaxZoom()));
      if (!fromZoom && !expanded) {
        map.setZoom(fittedMinZoom);
        map.panTo(L.latLngBounds(routes[state.routeIndex].path).getCenter());
      }
    }

    function updateZoomControls() {
      if (!fittedMinZoom) return;
      const { zoomInDisabled, zoomOutDisabled } = getZoomControlState({
        zoom: map.getZoom(),
        minZoom: fittedMinZoom,
        maxZoom: map.getMaxZoom(),
      });
      document.querySelector('#zoomInButton').disabled = zoomInDisabled;
      document.querySelector('#zoomOutButton').disabled = zoomOutDisabled;
    }

    function openSheet() {
      renderRouteOptions();
      routeSheet.classList.add('open');
      document.querySelector('#sheetClose').focus();
    }

    function closeSheet() {
      routeSheet.classList.remove('open');
      document.querySelector('#routeButton').focus();
    }

    document.querySelector('#forecastStrip').addEventListener('click', (event) => {
      const button = event.target.closest('[data-day]');
      if (!button) return;
      state.dayIndex = Number(button.dataset.day);
      renderDays();
      renderMap();
    });

    document.querySelector('.layer-switch').addEventListener('click', (event) => {
      const button = event.target.closest('[data-layer]');
      if (!button) return;
      state.layer = button.dataset.layer;
      document.querySelectorAll('[data-layer]').forEach((item) => item.setAttribute('aria-pressed', item === button ? 'true' : 'false'));
      renderMap();
    });

    document.querySelector('#routeList').addEventListener('click', (event) => {
      const button = event.target.closest('[data-route]');
      if (!button) return;
      state.routeIndex = Number(button.dataset.route);
      closeSheet();
      renderRouteOptions();
      renderMap({ fit: true });
    });

    document.querySelector('#routeButton').addEventListener('click', openSheet);
    document.querySelector('#departureTimeInput').addEventListener('input', (event) => {
      if (!event.target.value) return;
      state.departureTimes[routes[state.routeIndex].id] = event.target.value;
      renderMap();
      renderRouteOptions();
    });
    document.querySelector('#sheetClose').addEventListener('click', closeSheet);
    document.querySelector('#sheetBackdrop').addEventListener('click', closeSheet);
    document.querySelector('#expandButton').addEventListener('click', () => setExpanded(!state.expanded));
    document.querySelector('#zoomInButton').addEventListener('click', () => map.zoomIn(1));
    document.querySelector('#zoomOutButton').addEventListener('click', () => map.zoomOut(1));
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && routeSheet.classList.contains('open')) closeSheet(); });
    map.on('zoomend', () => {
      if (!fittedMinZoom) return;
      updateZoomControls();
      const shouldExpand = map.getZoom() > fittedMinZoom + .25;
      if (shouldExpand !== state.expanded) setExpanded(shouldExpand, true);
    });

    renderDays();
    renderRouteOptions();
    renderMap({ fit: true });
  </script>
</body>
</html>
